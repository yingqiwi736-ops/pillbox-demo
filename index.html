function playClip(key, fallback){
  if(!voiceOn) return;
  stopSpeak();
  try{
    const src = AUDIO_SRC[key];
    if(!src || src.indexOf('__AUDIO') === 0){ speak(fallback); return; }
    const a = new Audio('data:audio/mp4;base64,' + src);
    currentAudio = a;
    a.onerror = () => speak(fallback);
    const p = a.play();
    if(p && p.catch) p.catch(() => speak(fallback));
  }catch(e){ speak(fallback); }
}
function speak(text){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  try{
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.05;
    let done = false;
    const go = () => {
      if(done) return; done = true;
      const vs = synth.getVoices();
      const v = vs.find(x=>/zh[-_]CN|cmn-Hans/i.test(x.lang)) || vs.find(x=>/Tingting|Ting-Ting|普通话|中文/i.test(x.name))
             || vs.find(x=>/^zh/i.test(x.lang));
      if(v) u.voice = v;
      synth.speak(u);
    };
    if(synth.getVoices().length) go();
    else { synth.addEventListener('voiceschanged', go, {once:true}); setTimeout(go, 350); }
  }catch(e){}
}
function stopSpeak(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  if(currentAudio){ try{ currentAudio.pause(); currentAudio.currentTime = 0; }catch(e){} currentAudio = null; }
}

function render(){
  const elder = S.mode==='elder';
  const phone = $('#phone');
  phone.className = 'phone ' + (elder?'dark-bg':'app-bg');
  let body;
  if(elder) body = S.elderPage==='home'?elderHome() : S.elderPage==='meds'?elderMeds() : S.elderPage==='confirm'?elderConfirm() : S.elderPage==='success'?elderSuccess() : elderCall();
  else body = S.familyTab==='home'?familyHome() : S.familyTab==='stats'?familyStats() : S.familyTab==='meds'?familyMeds() : familySettings();
  phone.innerHTML = statusbar(elder) + `<div class="screen-body">${body}</div>` + homebar + overlay();

  $('#modeElder').className = 'on elder';
  $('#modeFamily').className = '';
  if(!elder){ $('#modeElder').className=''; $('#modeFamily').className='on family'; }

  const n = takenCount();
  $('#cloudStatus').innerHTML = `
    <div class="row"><span>设备状态</span><b>在线 · 电量 86%</b></div>
    <div class="row"><span>今日服药</span><b class="${n>0?'green':''}">${n} / 3 次</b></div>
    <div class="row"><span>08:00 上午</span><b class="${S.taken.morning?'green':''}">${S.taken.morning?'已服 ✓':'待服'}</b></div>
    <div class="row"><span>12:30 中午</span><b class="${S.missed.noon?'red':''}">${S.missed.noon?'异常 · 漏服':'待服'}</b></div>
    <div class="row"><span>19:00 晚上</span><b>待服</b></div>
    <div class="row"><span>已绑定家属</span><b>2 人</b></div>`;
  $('#logList').innerHTML = S.logs.map(l=>`<div class="log-item ${l.cls}"><b>${l.t}</b>${l.txt}</div>`).join('');
  renderScenes();
}
function currentSceneId(){
  if(S.mode==='elder') return S.elderPage==='home'?'elder-home':S.elderPage==='meds'?'elder-meds':'elder-confirm';
  return 'family-'+S.familyTab;
}
function renderScenes(){
  const cur = currentSceneId();
  let html='', lastGroup='';
  SCENES.forEach(sc=>{
    if(sc.group!==lastGroup){ html += `<div class="scene-group">${sc.group==='elder'?'老人端 · 长辈模式':'亲属端 · 家属模式'}</div>`; lastGroup=sc.group; }
    html += `<button class="scene-btn ${sc.group==='elder'?'e':''} ${cur===sc.id?'on':''}" data-scene="${sc.id}">${sc.label}</button>`;
  });
  $('#sceneList').innerHTML = html;
  const sc = SCENES.find(x=>x.id===cur) || SCENES[0];
  $('#scriptCard').innerHTML = `<b>讲解要点 · ${sc.label}</b>${sc.tip}<span class="try">▸ ${sc.try}</span>`;
}

/* ---------- 交互 ---------- */
function setScene(id){
  const sc = SCENES.find(x=>x.id===id); if(!sc) return;
  S.mode = sc.mode; S.overlay=null;
  if(sc.mode==='elder') S.elderPage = sc.page; else S.familyTab = sc.tab;
  S.scene=id; render();
}
function setMode(m){ S.mode=m; S.overlay=null; render(); subtitle(m==='elder'?'已切到老人端 · 长辈模式':'已切到亲属端 · 家属模式'); }
function reset(){ stopSpeak(); S = DEFAULT(); render(); subtitle('已重置为初始状态 · 可以从头再演示一遍'); }

$('#phone').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  stopSpeak();
  if(a==='go-meds'){ S.elderPage='meds'; render(); subtitle('老人想知道吃什么药 → 进入大字用药详情'); }
  else if(a==='go-confirm'){ S.elderPage='confirm'; render(); subtitle('老人吃完药 → 进入单动作确认页'); }
  else if(a==='go-call'){ S.elderPage='call'; render(); addLog('老人端发起一键呼叫 小敏'); subtitle('一键联系家人，无需翻通讯录'); }
  else if(a==='elder-home'){ S.elderPage='home'; render(); subtitle('返回老人端首页'); }
  else if(a==='voice'){ S.overlay='voice'; render(); addLog('普通话语音播报已播放（口语化说明）'); subtitle('AI 把说明书翻成老人听得懂的话，用普通话念出来', true); playClip('meds','该吃药啦，和早饭一起吃。降压药一粒，降糖药一粒。二号、三号药格已经亮了灯。吃完记得按一下绿色按钮。'); }
  else if(a==='confirm-take'){
    if(!S.taken.morning){
      S.taken.morning=true; S.elderPage='success';
      addLog('老人端确认服药：降压药×1、降糖药×1','hi');
      addLog('已同步至云端 → 推送给小敏、小刚（2 位家属）','hi');
      subtitle('已确认！记录同步到云端 → 现在切到亲属端看变化', true);
      playClip('success','吃过药啦！真棒，明天也要记得按时吃药。');
    } else { subtitle('上午的药已经确认过啦，切到亲属端看看记录'); }
    render();
  }
  else if(a.startsWith('tab-')){ S.familyTab=a.replace('tab-',''); render(); subtitle('亲属端 · '+({home:'首页',stats:'数据统计',meds:'药品管理',settings:'提醒设置'}[S.familyTab])); }
  else if(a.startsWith('sw-')){ const k=a.split('-')[1]; S.sw[k]=!S.sw[k]; render(); addLog('家属修改提醒规则：'+k+' → '+(S.sw[k]?'开启':'关闭')); subtitle('提醒规则已'+(S.sw[k]?'开启':'关闭')+'，设置会下发到药盒'); }
  else if(a==='add-med'){ S.overlay='addmed'; render(); subtitle('演示家属录入新药品'); }
  else if(a==='submit-med'){
    const v = ($('#medName') && $('#medName').value.trim()) || '新药品';
    S.extraMeds.push(v); S.overlay=null; render();
    addLog('家属新增药品「'+v+'」，已下发药盒用药计划','hi');
    subtitle('新药品已保存并同步到药盒', true);
  }
  else if(a==='add-sched'){ subtitle('新增提醒时间：V1 支持按日程配置（演示版略）'); }
  else if(a==='reminder-ok'){ S.overlay=null; S.elderPage='confirm'; stopSpeak(); render(); subtitle('老人看到提醒 → 取药 → 进入确认页'); }
  else if(a==='close-overlay'){ S.overlay=null; stopSpeak(); render(); }
});
$('#sceneList').addEventListener('click', e=>{ const b=e.target.closest('[data-scene]'); if(b){ stopAuto(); setScene(b.dataset.scene); subtitle(SCENES.find(x=>x.id===b.dataset.scene).tip, true); }});
$('#modeElder').addEventListener('click', ()=>{ stopAuto(); setMode('elder'); });
$('#modeFamily').addEventListener('click', ()=>{ stopAuto(); setMode('family'); });
$('#resetBtn').addEventListener('click', ()=>{ stopAuto(); reset(); });
$('#soundBtn').addEventListener('click', ()=>{
  voiceOn = !voiceOn;
  if(!voiceOn) stopSpeak();
  $('#soundBtn').textContent = voiceOn ? '声音：开' : '声音：关';
  $('#soundBtn').style.color = voiceOn ? '#4A5A6A' : '#B0BAC4';
  subtitle(voiceOn ? '语音已开启 · 点「听语音念给我听」可试听' : '语音已关闭');
});
$('#fullBtn').addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); });
$('#remindBtn').addEventListener('click', ()=>{ stopAuto(); setMode('elder'); S.overlay='reminder'; render(); addLog('08:00 定时提醒触发：语音 + 灯光 + 大字','hi'); subtitle('到点提醒：药盒亮灯 + 普通话语音 + 大字，不依赖老人看手机', true); playClip('remind','到点吃药啦！早上八点，降压药一粒，降糖药一粒。二号、三号药格已经亮灯，和早饭一起吃。'); });
$('#missBtn').addEventListener('click', ()=>{
  stopAuto(); S.missed.noon=true; setScene('family-home');
  addLog('12:30 超时未确认 → 已二次提醒老人','warn');
  addLog('漏服异常升级：推送通知给 2 位家属','warn');
  subtitle('异常链路：先二次提醒老人 → 超时才升级通知家属', true);
});

/* ---------- 自动演示 ---------- */
let autoToken = 0;
function stopAuto(){ S.auto=false; autoToken++; stopSpeak(); $('#autoBtn').classList.remove('playing'); $('#autoBtn').textContent='▶ 自动演示'; }
async function autoPlay(){
  if(S.auto){ stopAuto(); return; }
  S.auto=true; const token=++autoToken;
  $('#autoBtn').classList.add('playing'); $('#autoBtn').textContent='■ 停止演示';
  reset(); S.auto=true;
  const step = async (fn, txt, ms=2600) => {
    if(!S.auto || token!==autoToken) return false;
    fn(); subtitle(txt, true); await sleep(ms);
    return S.auto && token===autoToken;
  };
  if(!await step(()=>setScene('elder-home'),'① 老人端首页：只有三个大按钮，没有文字菜单',3200)) return finish();
  if(!await step(()=>{ S.elderPage='meds'; render(); },'② 点「现在要吃什么药」→ 大字药名 + AI 口语化说明',3000)) return finish();
  if(!await step(()=>{ S.overlay='voice'; render(); playClip('meds','该吃药啦，和早饭一起吃。降压药一粒，降糖药一粒。二号、三号药格已经亮了灯。'); },'③ 不识字也没关系，点一下用普通话念给您听',3800)) return finish();
  if(!await step(()=>{ S.overlay=null; S.elderPage='confirm'; render(); },'④ 吃完药 → 全屏只有一个「我吃好药了」按钮',3000)) return finish();
  if(!await step(()=>{ S.taken.morning=true; S.elderPage='success'; addLog('老人端确认服药：降压药×1、降糖药×1','hi'); addLog('已同步至云端 → 推送给 2 位家属','hi'); playClip('success','吃过药啦！真棒，明天也要记得按时吃药。'); render(); },'⑤ 确认成功 → 记录同步到云端，并告诉老人「家人能看到」',3800)) return finish();
  if(!await step(()=>{ setScene('family-home'); },'⑥ 切到亲属端：08:00 记录已变「已服」，今日完成 1/3，AI 摘要同步更新',3600)) return finish();
  if(!await step(()=>{ S.familyTab='stats'; render(); },'⑦ 数据统计里「今天」的柱子也跟着变了',3000)) return finish();
  if(!await step(()=>{ S.familyTab='settings'; render(); },'⑧ 家属可配置提醒与异常升级规则，先提醒老人、再通知家属',3200)) return finish();
  finish();
  function finish(){ if(token===autoToken){ stopAuto(); subtitle('演示结束 · 可自由点击体验，或按 R 重置从头再来', true); } }
}
$('#autoBtn').addEventListener('click', autoPlay);

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key;
  if(k>='1'&&k<='7'){ stopAuto(); setScene(SCENES[parseInt(k)-1].id); subtitle(SCENES[parseInt(k)-1].tip, true); }
  else if(k==='ArrowRight'||k==='ArrowLeft'){
    e.preventDefault(); stopAuto();
    const cur=SCENES.findIndex(x=>x.id===currentSceneId());
    const i=(cur+(k==='ArrowRight'?1:-1)+SCENES.length)%SCENES.length;
    setScene(SCENES[i].id); subtitle(SCENES[i].tip, true);
  }
  else if(k===' '){ e.preventDefault(); $('#remindBtn').click(); }
  else if(k.toLowerCase()==='m'){ stopAuto(); setMode(S.mode==='elder'?'family':'elder'); }
  else if(k.toLowerCase()==='r'){ stopAuto(); reset(); }
});

/* ---------- 自适应缩放 ---------- */
function fit(){
  const avail = window.innerHeight - 64 - 22 - 20 - 46 - 26 - 24;
  const s = Math.max(.62, Math.min(1, avail/812));
  const scaler=$('#scaler');
  scaler.style.width = (375*s)+'px'; scaler.style.height=(812*s)+'px';
  $('#phone').style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
fit();
render();
</script>
