<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>AI 智能药盒 · 交互演示版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  body { font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; background:#EDEFF2; color:#1A2B3C; overflow-x:hidden; }
  button { font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  .topbar { height:64px; background:#fff; border-bottom:1px solid #E2E7ED; display:flex; align-items:center; padding:0 24px; gap:20px; position:relative; z-index:20; }
  .brand { display:flex; align-items:center; gap:10px; min-width:230px; }
  .brand .logo { width:32px; height:32px; border-radius:10px; background:#E8663C; display:flex; align-items:center; justify-content:center; }
  .brand b { font-size:15px; font-weight:600; }
  .brand small { display:block; font-size:11px; color:#8A97A5; font-weight:400; }
  .mode-switch { display:flex; background:#F0F3F6; border-radius:10px; padding:4px; gap:2px; }
  .mode-switch button { padding:8px 20px; border-radius:7px; font-size:13px; font-weight:500; color:#6B7A89; white-space:nowrap; }

  .scene-btn.on.e { background:#FEF3EC; color:#C4562B; border-left-color:#E8663C; }
  .script-card { margin-top:16px; background:#F7F9FB; border-radius:10px; padding:12px; font-size:12px; line-height:1.7; color:#4A5A6A; }

  .script-card .try { display:block; margin-top:8px; padding-top:8px; border-top:1px dashed #DDE4EB; color:#C4562B; font-size:11.5px; }

  .phone-scaler { position:relative; }
  .phone { width:375px; height:812px; background:#F7F5F2; border-radius:40px; border:8px solid #1C1C1E; overflow:hidden; position:relative; display:flex; flex-direction:column; transform-origin:top left; }
  .phone.dark-bg { background:#FFF9F0; }
  .phone.app-bg { background:#F4F6F8; }
  .statusbar { height:44px; display:flex; justify-content:space-between; align-items:flex-end; padding:0 28px 6px; font-size:14px; font-weight:600; flex-shrink:0; }
  .notch { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:120px; height:28px; background:#1C1C1E; border-radius:16px; z-index:9; }

  .elder-card-next.done { border-color:#CDE8D3; background:#F4FBF5; }

  .nav-header { padding:12px 0 16px; display:flex; align-items:center; gap:12px; }

  .nav-header .title { font-size:24px; font-weight:600; color:#2B2B2B; }

  .elder-med-card .row1 { display:flex; align-items:center; gap:14px; }

  .pill-icon.teal .cap { background:linear-gradient(90deg,#2E8B8B 50%,#9FE1CB 50%); }
  .pill-icon.blue .cap { background:linear-gradient(90deg,#3D7FB8 50%,#B5D4F4 50%); }
  .elder-med-card .nm { font-size:26px; font-weight:600; color:#2B2B2B; }
  .elder-med-card .ds { font-size:18px; color:#888; margin-top:4px; }
  .elder-med-card .tip { margin-top:14px; background:#F7F5F2; border-radius:14px; padding:12px 14px; font-size:17px; color:#6B6B6B; line-height:1.5; }
  .voice-bar { margin-top:14px; background:#E8663C; border-radius:20px; padding:18px; display:flex; align-items:center; justify-content:center; gap:12px; color:#fff; font-size:22px; font-weight:600; width:100%; }
  .confirm-hero { margin-top:12px; background:#fff; border-radius:28px; padding:26px 24px; text-align:center; border:2px solid #D9EEDD; }
  .confirm-hero .big-q { font-size:29px; font-weight:600; color:#2B2B2B; line-height:1.4; }
  .confirm-hero .big-m { font-size:23px; color:#666; margin-top:10px; }

  .confirm-btn:hover { background:#348A53; }

  .success-hero { margin-top:56px; text-align:center; }

  @keyframes pop { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.08)} 100%{transform:scale(1);opacity:1} }
  .success-hero h2 { font-size:34px; font-weight:600; color:#2E7D32; }
  .success-hero p { font-size:20px; color:#6B7A6A; margin-top:14px; line-height:1.6; }
  .sync-badge { margin:26px auto 0; background:#EDF3F8; border-radius:16px; padding:14px; font-size:16px; color:#2C6EA5; line-height:1.6; width:100%; }
  .call-hero { margin-top:70px; text-align:center; }

  .call-hero h2 { font-size:30px; color:#2B2B2B; font-weight:600; }

  .wave { display:flex; gap:5px; justify-content:center; align-items:center; height:26px; margin-top:22px; }

  .wave i:nth-child(2){animation-delay:.12s}.wave i:nth-child(3){animation-delay:.24s}.wave i:nth-child(4){animation-delay:.36s}.wave i:nth-child(5){animation-delay:.48s}

  .ai-card { margin-top:12px; background:#2C3E50; border-radius:20px; padding:18px; color:#fff; }

  .sec-title .more { font-size:13px; color:#3D7FB8; font-weight:400; }

  .record .tm { font-size:15px; font-weight:600; color:#1A2B3C; width:52px; flex-shrink:0; }
  .record .info { flex:1; }
  .record .info .n { font-size:15px; color:#1A2B3C; font-weight:500; }
  .record .info .d { font-size:12px; color:#8A97A5; margin-top:2px; }
  .pill-status { font-size:12px; padding:5px 10px; border-radius:20px; font-weight:500; flex-shrink:0; }
  .st-ok { background:#E5F3E8; color:#2E7D32; } .st-late { background:#FBF0DC; color:#B07A1A; }
  .st-miss { background:#FCEBE8; color:#C0392B; } .st-todo { background:#E8F0F7; color:#3D7FB8; }
  .alert-row { background:#FCEBE8; border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start; margin-top:16px; }
  .alert-row .tx { font-size:14px; color:#8C2B21; line-height:1.5; flex:1; }
  .alert-row .tx b { display:block; font-size:15px; margin-bottom:2px; }
  .ok-row { background:#E9F5EC; border-radius:16px; padding:12px 16px; display:flex; gap:10px; align-items:center; margin-top:16px; font-size:13.5px; color:#2E7D32; }
  .tabbar { height:76px; background:#fff; border-top:1px solid #E8ECF0; display:flex; padding:10px 8px 0; flex-shrink:0; }

  .tab .ti { height:26px; display:flex; align-items:center; justify-content:center; }
  .tab.on { color:#2C6EA5; font-weight:600; }
  .chart-card { background:#fff; border-radius:16px; padding:16px; margin-top:12px; }
  .chart-card .ct { font-size:15px; font-weight:600; color:#1A2B3C; }
  .chart-card .cs { font-size:12px; color:#8A97A5; margin-top:4px; }
  .bars { display:flex; align-items:flex-end; gap:12px; height:104px; margin-top:14px; padding:0 4px; }
  .bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .bar-col .bar { width:100%; border-radius:6px 6px 3px 3px; background:#7FB3DC; transition:height .5s; }
  .bar-col .bar.full { background:#3D7FB8; } .bar-col .bar.warn { background:#E8B34B; } .bar-col .bar.miss { background:#C0392B; }
  .bar-col .bl { font-size:11px; color:#8A97A5; }
  .legend { display:flex; gap:16px; margin-top:11px; }
  .legend span { font-size:12px; color:#8A97A5; display:flex; align-items:center; gap:6px; }

  .ring-row { display:flex; gap:12px; margin-top:16px; }

  .ring .inner { width:50px; height:50px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; }
  .ring-box .k { font-size:13px; color:#8A97A5; }

  .stock { font-size:12px; font-weight:600; padding:6px 10px; border-radius:8px; flex-shrink:0; }
  .stock.ok { background:#E5F3E8; color:#2E7D32; } .stock.low { background:#FBF0DC; color:#B07A1A; }
  .add-btn { margin-top:6px; border:1.5px dashed #B9C6D2; border-radius:16px; padding:16px; text-align:center; color:#3D7FB8; font-size:15px; font-weight:500; background:#fff; width:100%; }

function playClip(key){
  const d = dInfo(S.dialect);
  const fb = (d.t && d.t[key]) || (dInfo('mandarin').t[key]);
  if(!voiceOn){ return; }
  stopSpeak();
  if(!d.avail){ dialectToast(d); return; }
  try{
    const src = (AUDIO_SRC[d.id] && AUDIO_SRC[d.id][key]) || null;
    if(!src){ speak(fb, d.id); return; }
    const a = new Audio('data:audio/mp4;base64,' + src);
    currentAudio = a;
    a.onerror = () => speak(fb, d.id);
    const p = a.play();
    if(p && p.catch) p.catch(() => speak(fb, d.id));
  }catch(e){ speak(fb, d.id); }
}
function speak(text, dId){
  if(!voiceOn || !('speechSynthesis' in window)) return;
  try{
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (dId === 'yue') ? 'zh-HK' : 'zh-CN'; u.rate = 0.95; u.pitch = 1.05;
    let done = false;
    const go = () => {
      if(done) return; done = true;
      const vs = synth.getVoices();
      const v = (dId === 'yue')
        ? (vs.find(x=>/zh[-_]HK|yue/i.test(x.lang)) || vs.find(x=>/Sinji|Cantonese|粤/i.test(x.name)))
        : (vs.find(x=>/zh[-_]CN|cmn-Hans/i.test(x.lang)) || vs.find(x=>/Tingting|Ting-Ting|普通话|中文/i.test(x.name)))
          || vs.find(x=>/^zh/i.test(x.lang));
      if(v) u.voice = v;
      synth.speak(u);
    };
    if(synth.getVoices().length) go();
    else { synth.addEventListener('voiceschanged', go, {once:true}); setTimeout(go, 350); }
  }catch(e){}
}
function stopSpeak(){
  try{ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }catch(e){}
  if(currentAudio){ try{ currentAudio.pause(); currentAudio.currentTime = 0; }catch(e){} currentAudio = null; }
}
let dlToastTimer = null;
function dialectToast(d){
  let el = document.getElementById('dlToast');
  if(!el){ el = document.createElement('div'); el.id='dlToast'; el.className='dl-toast'; document.body.appendChild(el); }
  el.textContent = d.name + '语音包下载中 · 预计 V1.1 上线';
  el.classList.add('show');
  clearTimeout(dlToastTimer);
  dlToastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}
function takenCount(){ return Object.values(S.taken).filter(Boolean).length; }
function subtitle(txt, flash=false){ const el=$('#subtitle'); el.textContent=txt; el.classList.toggle('flash', flash); }

    <div class="row"><span>19:00 晚上</span><b>待服</b></div>
    <div class="row"><span>已绑定家属</span><b>2 人</b></div>`;
  $('#logList').innerHTML = S.logs.map(l=>`<div class="log-item ${l.cls}"><b>${l.t}</b>${l.txt}</div>`).join('');
  renderScenes();
}
function currentSceneId(){
  if(S.mode==='elder') return S.elderPage==='home'?'elder-home':S.elderPage==='meds'?'elder-meds':'elder-confirm';
  return 'family-'+S.familyTab;
}
function renderScenes(){
  const cur = currentSceneId();
  let html='', lastGroup='';
  SCENES.forEach(sc=>{
    if(sc.group!==lastGroup){ html += `<div class="scene-group">${sc.group==='elder'?'老人端 · 长辈模式':'亲属端 · 家属模式'}</div>`; lastGroup=sc.group; }
    html += `<button class="scene-btn ${sc.group==='elder'?'e':''} ${cur===sc.id?'on':''}" data-scene="${sc.id}">${sc.label}</button>`;
  });
  $('#sceneList').innerHTML = html;
  const sc = SCENES.find(x=>x.id===cur) || SCENES[0];
  $('#scriptCard').innerHTML = `<b>讲解要点 · ${sc.label}</b>${sc.tip}<span class="try">▸ ${sc.try}</span>`;
}

/* ---------- 交互 ---------- */
function setScene(id){
  const sc = SCENES.find(x=>x.id===id); if(!sc) return;
  S.mode = sc.mode; S.overlay=null;
  if(sc.mode==='elder') S.elderPage = sc.page; else S.familyTab = sc.tab;
  S.scene=id; render();
}
function setMode(m){ S.mode=m; S.overlay=null; render(); subtitle(m==='elder'?'已切到老人端 · 长辈模式':'已切到亲属端 · 家属模式'); }
function reset(){ stopSpeak(); S = DEFAULT(); render(); subtitle('已重置为初始状态 · 可以从头再演示一遍'); }

$('#phone').addEventListener('click', (e)=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  stopSpeak();
  if(a==='go-meds'){ S.elderPage='meds'; render(); subtitle('老人想知道吃什么药 → 进入大字用药详情'); }
  else if(a==='go-confirm'){ S.elderPage='confirm'; render(); subtitle('老人吃完药 → 进入单动作确认页'); }
  else if(a==='go-call'){ S.elderPage='call'; render(); addLog('老人端发起一键呼叫 小敏'); subtitle('一键联系家人，无需翻通讯录'); }
  else if(a==='elder-home'){ S.elderPage='home'; render(); subtitle('返回老人端首页'); }
  else if(a==='set-dialect'){
    const id = el.dataset.d, d = dInfo(id);
    S.dialect = id;
    if(d.avail){ S.overlay='voice'; render(); playClip('meds'); addLog('语音方言切换 → '+d.name+(d.preview?'（预览音色）':'')); subtitle('老人端语音已切换为'+d.name+(d.preview?' · 预览音色':'')+'，立即试听', true); }
    else { render(); dialectToast(d); subtitle(d.name+'语音包尚未上线 · 已加入下载队列，V1.1 自动推送', true); }
  }
  else if(a==='pick-dialect'){ S.overlay='dialectpick'; render(); subtitle('家属可替老人选择播报方言，设置下发到药盒'); }
  else if(a==='voice'){ S.overlay='voice'; render(); addLog(dInfo(S.dialect).name+'语音播报已播放（口语化说明）'); subtitle('AI 把说明书翻成老人听得懂的话，用'+dInfo(S.dialect).name+'念出来', true); playClip('meds','该吃药啦，和早饭一起吃。降压药一粒，降糖药一粒。二号、三号药格已经亮了灯。吃完记得按一下绿色按钮。'); }
  else if(a==='confirm-take'){
    if(!S.taken.morning){
      S.taken.morning=true; S.elderPage='success';
      addLog('老人端确认服药：降压药×1、降糖药×1','hi');
      addLog('已同步至云端 → 推送给小敏、小刚（2 位家属）','hi');
      subtitle('已确认！记录同步到云端 → 现在切到亲属端看变化', true);
      playClip('success','吃过药啦！真棒，明天也要记得按时吃药。');
    } else { subtitle('上午的药已经确认过啦，切到亲属端看看记录'); }
    render();
  }
  else if(a.startsWith('tab-')){ S.familyTab=a.replace('tab-',''); render(); subtitle('亲属端 · '+({home:'首页',stats:'数据统计',meds:'药品管理',settings:'提醒设置'}[S.familyTab])); }
  else if(a.startsWith('sw-')){ const k=a.split('-')[1]; S.sw[k]=!S.sw[k]; render(); addLog('家属修改提醒规则：'+k+' → '+(S.sw[k]?'开启':'关闭')); subtitle('提醒规则已'+(S.sw[k]?'开启':'关闭')+'，设置会下发到药盒'); }
  else if(a==='add-med'){ S.overlay='addmed'; render(); subtitle('演示家属录入新药品'); }
  else if(a==='submit-med'){
    const v = ($('#medName') && $('#medName').value.trim()) || '新药品';
    S.extraMeds.push(v); S.overlay=null; render();
    addLog('家属新增药品「'+v+'」，已下发药盒用药计划','hi');
    subtitle('新药品已保存并同步到药盒', true);
  }
  else if(a==='add-sched'){ subtitle('新增提醒时间：V1 支持按日程配置（演示版略）'); }
  else if(a==='reminder-ok'){ S.overlay=null; S.elderPage='confirm'; stopSpeak(); render(); subtitle('老人看到提醒 → 取药 → 进入确认页'); }
  else if(a==='close-overlay'){ S.overlay=null; stopSpeak(); render(); }
});
$('#sceneList').addEventListener('click', e=>{ const b=e.target.closest('[data-scene]'); if(b){ stopAuto(); setScene(b.dataset.scene); subtitle(SCENES.find(x=>x.id===b.dataset.scene).tip, true); }});
$('#modeElder').addEventListener('click', ()=>{ stopAuto(); setMode('elder'); });
$('#modeFamily').addEventListener('click', ()=>{ stopAuto(); setMode('family'); });
$('#resetBtn').addEventListener('click', ()=>{ stopAuto(); reset(); });
$('#soundBtn').addEventListener('click', ()=>{
  voiceOn = !voiceOn;
  if(!voiceOn) stopSpeak();
  $('#soundBtn').textContent = voiceOn ? '声音：开' : '声音：关';
  $('#soundBtn').style.color = voiceOn ? '#4A5A6A' : '#B0BAC4';
  subtitle(voiceOn ? '语音已开启 · 点「听语音念给我听」可试听' : '语音已关闭');
});
$('#fullBtn').addEventListener('click', ()=>{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); });
$('#remindBtn').addEventListener('click', ()=>{ stopAuto(); setMode('elder'); S.overlay='reminder'; render(); addLog('08:00 定时提醒触发：语音 + 灯光 + 大字','hi'); subtitle('到点提醒：药盒亮灯 + 普通话语音 + 大字，不依赖老人看手机', true); playClip('remind','到点吃药啦！早上八点，降压药一粒，降糖药一粒。二号、三号药格已经亮灯，和早饭一起吃。'); });
$('#missBtn').addEventListener('click', ()=>{
  stopAuto(); S.missed.noon=true; setScene('family-home');
  addLog('12:30 超时未确认 → 已二次提醒老人','warn');
  addLog('漏服异常升级：推送通知给 2 位家属','warn');
  subtitle('异常链路：先二次提醒老人 → 超时才升级通知家属', true);
});

/* ---------- 自动演示 ---------- */
let autoToken = 0;
function stopAuto(){ S.auto=false; autoToken++; stopSpeak(); $('#autoBtn').classList.remove('playing'); $('#autoBtn').textContent='▶ 自动演示'; }
async function autoPlay(){
  if(S.auto){ stopAuto(); return; }
  S.auto=true; const token=++autoToken;
  $('#autoBtn').classList.add('playing'); $('#autoBtn').textContent='■ 停止演示';
  reset(); S.auto=true;
  const step = async (fn, txt, ms=2600) => {
    if(!S.auto || token!==autoToken) return false;
    fn(); subtitle(txt, true); await sleep(ms);
    return S.auto && token===autoToken;
  };
  if(!await step(()=>setScene('elder-home'),'① 老人端首页：只有三个大按钮，没有文字菜单',3200)) return finish();
  if(!await step(()=>{ S.elderPage='meds'; render(); },'② 点「现在要吃什么药」→ 大字药名 + AI 口语化说明',3000)) return finish();
  if(!await step(()=>{ S.overlay='voice'; render(); playClip('meds','该吃药啦，和早饭一起吃。降压药一粒，降糖药一粒。二号、三号药格已经亮了灯。'); },'③ 不识字也没关系，点一下用普通话念给您听',3800)) return finish();
  if(!await step(()=>{ S.overlay=null; S.elderPage='confirm'; render(); },'④ 吃完药 → 全屏只有一个「我吃好药了」按钮',3000)) return finish();
  if(!await step(()=>{ S.taken.morning=true; S.elderPage='success'; addLog('老人端确认服药：降压药×1、降糖药×1','hi'); addLog('已同步至云端 → 推送给 2 位家属','hi'); playClip('success','吃过药啦！真棒，明天也要记得按时吃药。'); render(); },'⑤ 确认成功 → 记录同步到云端，并告诉老人「家人能看到」',3800)) return finish();
  if(!await step(()=>{ setScene('family-home'); },'⑥ 切到亲属端：08:00 记录已变「已服」，今日完成 1/3，AI 摘要同步更新',3600)) return finish();
  if(!await step(()=>{ S.familyTab='stats'; render(); },'⑦ 数据统计里「今天」的柱子也跟着变了',3000)) return finish();
  if(!await step(()=>{ S.familyTab='settings'; render(); },'⑧ 家属可配置提醒与异常升级规则，先提醒老人、再通知家属',3200)) return finish();
  finish();
  function finish(){ if(token===autoToken){ stopAuto(); subtitle('演示结束 · 可自由点击体验，或按 R 重置从头再来', true); } }
}
$('#autoBtn').addEventListener('click', autoPlay);

/* ---------- 快捷键 ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const k=e.key;
  if(k>='1'&&k<='7'){ stopAuto(); setScene(SCENES[parseInt(k)-1].id); subtitle(SCENES[parseInt(k)-1].tip, true); }
  else if(k==='ArrowRight'||k==='ArrowLeft'){
    e.preventDefault(); stopAuto();
    const cur=SCENES.findIndex(x=>x.id===currentSceneId());
    const i=(cur+(k==='ArrowRight'?1:-1)+SCENES.length)%SCENES.length;
    setScene(SCENES[i].id); subtitle(SCENES[i].tip, true);
  }
  else if(k===' '){ e.preventDefault(); $('#remindBtn').click(); }
  else if(k.toLowerCase()==='m'){ stopAuto(); setMode(S.mode==='elder'?'family':'elder'); }
  else if(k.toLowerCase()==='r'){ stopAuto(); reset(); }
});

/* ---------- 自适应缩放 ---------- */
function fit(){
  const avail = window.innerHeight - 64 - 22 - 20 - 46 - 26 - 24;
  const s = Math.max(.62, Math.min(1, avail/812));
  const scaler=$('#scaler');
  scaler.style.width = (375*s)+'px'; scaler.style.height=(812*s)+'px';
  $('#phone').style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);
fit();
render();
</script>
</body>
</html>
